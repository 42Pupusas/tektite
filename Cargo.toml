[package]
name = "tektite"
version = "0.2.3"
edition = "2024"
description = "Obsidian-style Markdown renderer for egui, powered by marki-parse"
license = "MIT"
repository = "https://github.com/42Pupusas/tektite"
readme = "README.md"
keywords = ["egui", "eframe", "markdown", "commonmark"]
categories = ["gui", "text-processing"]

[dependencies]
# Markdown views exchange egui types with their host application. Keep this
# release line aligned so widget values never cross incompatible egui versions.
egui = "0.36"
marki-parse = "0.2"

[dev-dependencies]
eframe = "0.36"

[[example]]
name = "preview"
path = "examples/preview.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[lints.clippy]
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
